name: Réveil serveur Render
# Le serveur se garde lui-même éveillé de 7 h à minuit (core/keepAwake.js) ; la nuit il peut dormir.
# Cette tâche ne sert qu'à le réveiller le matin (GitHub lance les tâches programmées avec du retard,
# d'où plusieurs créneaux entre 5 h et 7 h UTC, soit 6 h à 9 h à Paris selon la saison).
on:
  schedule:
    - cron: '0,20,40 5,6,7 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 2 --retry-delay 30 --max-time 90 https://mymoodz-subscription-api.onrender.com/health || true
